name: Build and Export EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: npm install

      - name: Playwright kur
        run: npx playwright install chromium

      - name: Uygulamayı build et
        run: npm run build

      - name: EXE dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: IG-Request-Cancel-Tool
          path: dist/*.exe
